includeConfigs:
  - ${DRP_PIPE_DIR}/bps/clustering/LSSTCam-imSim/DRP-OR5-clustering.yaml
  - ${DRP_PIPE_DIR}/bps/resources/LSSTCam-imSim/nightly-validation-OR5-%(survey)s.yaml

pipelineYaml: "${DRP_PIPE_DIR}/pipelines/LSSTCam-imSim/nightly-validation.yaml#step1"

numberOfRetries: 2

environment:
   DAF_BUTLER_CONFIG_PATH: %(cache_config_path)s:${DAF_BUTLER_CONFIG_PATH}
   DAF_BUTLER_CACHE_DIRECTORY: /lscratch/${USER}/step1_cache
   DAF_BUTLER_CACHE_EXPIRATION_MODE: datasets=1000
   LSST_S3_USE_THREADS: False
   AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED

extraQgraphOptions: -c parameters:sasquatch_dataset_identifier=%(payload_name)s -c parameters:sasquatch_timestamp_version=explicit_timestamp:%(sasq_timestamp)sT000000Z

extraRunQuantumOptions: "--no-raise-on-partial-outputs"

payload:
  payloadName: %(payload_name)s
  inCollection: %(tagged_collection)s,2.2i/calib,skymaps,refcats,pretrained_models
  output: %(output_area)s/%(folder)s/%(lsst_version)s/%(ticket)s
  butlerConfig: %(repo)s
  dataQuery: "instrument='LSSTCam-imSim' and %(exposure_selection)s"
